<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Devinn Houston | Salesforce Admin & IT Specialist</title>
  <meta name="description" content="Devinn Houston - Salesforce Admin and IT Specialist portfolio site." />
  <meta property="og:title" content="Devinn Houston | Salesforce Admin & IT Specialist" />
  <meta property="og:description" content="Certified Salesforce Admin and IT Support Specialist showcasing resume, projects, and certifications." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://devinnhouston.com" />
  <meta property="og:image" content="https://devinnhouston.com/preview.png" />
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
  <style>
    /* Existing styles here */
    .progress-indicator {
      margin-top: 5px;
      font-size: 0.9rem;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <section>
    <!-- Existing content here -->
    <h2>Projects</h2>
    <ul>
      <li>
        <strong>💼 Salesforce: Automated Employee Onboarding Flow</strong><br>
        <div class="gallery" id="onboardingGallery">
          <img src="Employee_Onboarding_Flow_Screenshot1.png" alt="Flow Overview Screenshot">
          <div class="gallery-controls">
            <button onclick="prevSlide('onboardingGallery', onboardingImages)">Prev</button>
            <button onclick="nextSlide('onboardingGallery', onboardingImages)">Next</button>
            <div class="progress-indicator" id="onboardingProgress">1 / 5</div>
          </div>
        </div>
      </li>
      <li>
        <strong>🛠 Salesforce: IT Service Request App</strong><br>
        <div class="gallery" id="serviceGallery">
          <img src="Service_Request_Screenshot1.png" alt="Service Request App Screenshot 1">
          <div class="gallery-controls">
            <button onclick="prevSlide('serviceGallery', serviceImages)">Prev</button>
            <button onclick="nextSlide('serviceGallery', serviceImages)">Next</button>
            <div class="progress-indicator" id="serviceProgress">1 / 5</div>
          </div>
        </div>
      </li>
    </ul>
    <!-- Existing contact section here -->
  </section>
  <button class="back-to-top" id="backToTop">Top</button>

  <script>
    window.addEventListener('load', () => {
      document.body.style.opacity = '1';
    });

    const backToTop = document.getElementById('backToTop');
    window.addEventListener('scroll', () => {
      backToTop.style.display = window.scrollY > 300 ? 'block' : 'none';
    });
    backToTop.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    const onboardingImages = [
      "Employee_Onboarding_Flow_Screenshot1.png",
      "Employee_Onboarding_Flow_Screenshot2.png",
      "Employee_Onboarding_Flow_Screenshot3.png",
      "Employee_Onboarding_Flow_Screenshot4.png",
      "Employee_Onboarding_Flow_Screenshot5.png"
    ];
    const serviceImages = [
      "Service_Request_Screenshot1.png",
      "Service_Request_Screenshot2.png",
      "Service_Request_Screenshot3.png",
      "Service_Request_Screenshot4.png",
      "Service_Request_Screenshot5.png"
    ];

    const indices = {
      onboardingGallery: 0,
      serviceGallery: 0
    };

    function updateProgress(galleryId, images) {
      const progress = document.getElementById(galleryId === 'onboardingGallery' ? 'onboardingProgress' : 'serviceProgress');
      progress.textContent = `${indices[galleryId] + 1} / ${images.length}`;
    }

    function showImage(galleryId, images, index) {
      const gallery = document.getElementById(galleryId);
      const img = gallery.querySelector('img');
      img.classList.add('fade-out');
      setTimeout(() => {
        img.src = images[index];
        img.classList.remove('fade-out');
        updateProgress(galleryId, images);
      }, 500);
    }

    function nextSlide(galleryId, images) {
      indices[galleryId] = (indices[galleryId] + 1) % images.length;
      showImage(galleryId, images, indices[galleryId]);
    }

    function prevSlide(galleryId, images) {
      indices[galleryId] = (indices[galleryId] - 1 + images.length) % images.length;
      showImage(galleryId, images, indices[galleryId]);
    }

    setInterval(() => nextSlide('onboardingGallery', onboardingImages), 3000);
    setInterval(() => nextSlide('serviceGallery', serviceImages), 3000);
  </script>
</body>
</html>
